[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "premium-customer-churn"
version = "1.0.0"
description = "Reproducible machine-learning workflow for premium telecom customer churn prediction."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Nicolas Ernesto Juez Castañeda" }
]
dependencies = [
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<4.0",
  "scikit-learn>=1.5,<2.0",
  "xgboost>=2.1,<4.0",
  "matplotlib>=3.9,<4.0",
  "joblib>=1.4,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<10.0",
  "ruff>=0.8,<1.0",
  "nbformat>=5.10,<6.0",
  "jupyter>=1.1,<2.0",
]

[project.scripts]
churn-train = "churn_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
